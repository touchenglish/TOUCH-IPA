<!-- TOUCH English — IPA Pronunciation Course
     A data-driven, gamified learning engine.
     ARCHITECTURE OVERVIEW (see JS sections):
       1. CONTENT MODEL .... pure data: stages + exercises (the only thing you edit to add content)
       2. PERSISTENCE ...... saves/loads progress (browser localStorage + in-memory fallback)
       3. STATE STORE ...... single source of truth for the learner
       4. XP / LEVEL SYSTEM
       5. BADGE SYSTEM
       6. PROGRESSION SYSTEM (locking / unlocking)
       7. FEEDBACK SYSTEM (encouragement + hints + sound + confetti)
       8. REWARD SYSTEM (stage payouts)
       9. EXERCISE ENGINE (one reusable renderer for every question type)
      10. SCREEN ROUTER + STAGE TEMPLATE (Video → Learn → Exercises → Reward)
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#FFF6EA; --cream-2:#FFEFD8; --ink:#2C2418; --ink-soft:#6B6051;
  --line:#EBDFCB;
  --teal:#12B886; --teal-d:#0E9C72; --teal-dd:#0B7F5D;
  --coral:#FF7A59; --coral-d:#E85F3E;
  --sun:#FFC247; --sun-d:#E9A91F;
  --sky:#4FB0E8; --sky-d:#2E92CE;
  --plum:#8B6CE0; --plum-d:#6F4FCB;
  --good:#12B886; --good-d:#0E9C72;
  --bad:#FF5C7A; --bad-d:#E03E5E;
  --white:#FFFFFF;
  --shadow:0 6px 0; --soft:0 10px 30px rgba(60,40,10,.10);
  --r:22px;
  font-family:'Nunito',-apple-system,'Segoe UI','Noto Sans',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(120% 90% at 0% -10%, #FFF9F0 0%, rgba(255,249,240,0) 45%),
    radial-gradient(120% 90% at 100% 0%, #FFEBD0 0%, rgba(255,235,208,0) 50%),
    var(--cream);
  color:var(--ink);
  display:flex;justify-content:center;
  font-size:16px;-webkit-font-smoothing:antialiased;
}
/* phone frame on desktop, edge-to-edge on mobile */
#app{
  width:100%;max-width:470px;min-height:100vh;position:relative;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg, #FFFCF6 0%, #FFF6EA 100%);
  box-shadow:0 0 0 1px var(--line), 0 30px 80px rgba(70,45,10,.16);
  overflow:visible;            /* let the page scroll vertically (iOS Safari fix) */
  overflow-x:clip;             /* still hide any horizontal overspill */
}
@media(min-width:520px){ #app{margin:0 0;border-radius:0} body{align-items:stretch} }

h1,h2,h3,.disp{font-family:'Fredoka',sans-serif;font-weight:700;letter-spacing:.2px;margin:0}
.ipa{font-family:'Nunito','Segoe UI','Noto Sans',sans-serif;font-weight:800;letter-spacing:.5px}

/* ---------- HUD ---------- */
#hud{
  position:sticky;top:0;z-index:30;
  padding:12px 16px 10px;
  background:rgba(255,252,246,.86);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.hud-row{display:flex;align-items:center;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;
  padding:6px 11px;border-radius:999px;background:var(--white);
  border:1px solid var(--line);box-shadow:0 2px 0 var(--line);
}
.chip .ic{font-size:15px;line-height:1}
.chip.streak{color:var(--coral-d)} .chip.xp{color:var(--sun-d)}
.lvl{
  display:flex;align-items:center;gap:9px;margin-left:auto;
}
.lvl .ring{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--teal) var(--p,0deg), #E9E0CF 0deg);
  flex:none;
}
.lvl .ring i{width:26px;height:26px;border-radius:50%;background:var(--white);display:grid;place-items:center;
  font-family:'Fredoka';font-weight:700;font-size:13px;color:var(--teal-dd);font-style:normal}
.xpbar{height:10px;border-radius:99px;background:#EFE6D5;margin-top:9px;overflow:hidden;border:1px solid var(--line)}
.xpbar > i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--sun),var(--sun-d));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xptxt{font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:4px;text-align:right}
.sound-btn{margin-left:6px;background:none;border:none;font-size:17px;cursor:pointer;opacity:.7}

/* ---------- generic ---------- */
#screen{flex:1;display:flex;flex-direction:column;animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pad{padding:18px 18px 28px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  font-family:'Fredoka';font-weight:700;font-size:17px;color:#fff;cursor:pointer;
  padding:15px 18px;border:none;border-radius:16px;background:var(--teal);
  box-shadow:var(--shadow) var(--teal-dd);transition:transform .07s, box-shadow .07s, filter .15s;
  text-transform:uppercase;letter-spacing:.6px;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--teal-dd)}
.btn.coral{background:var(--coral);box-shadow:var(--shadow) var(--coral-d)} .btn.coral:active{box-shadow:0 2px 0 var(--coral-d)}
.btn.sun{background:var(--sun);color:#5a3d00;box-shadow:var(--shadow) var(--sun-d)} .btn.sun:active{box-shadow:0 2px 0 var(--sun-d)}
.btn.ghost{background:#fff;color:var(--ink-soft);box-shadow:var(--shadow) var(--line)} .btn.ghost:active{box-shadow:0 2px 0 var(--line)}
.btn[disabled]{filter:grayscale(.5) opacity(.45);pointer-events:none}
.btn.bad{background:var(--bad);box-shadow:var(--shadow) var(--bad-d)}

.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--soft)}

/* ---------- STAGE MAP ---------- */
.hero{padding:22px 18px 6px;text-align:center}
.hero .logo{display:inline-flex;align-items:center;gap:8px;font-family:'Fredoka';font-weight:700;
  font-size:13px;letter-spacing:2px;color:var(--teal-dd);text-transform:uppercase;
  background:#E7F7F0;border:1px solid #BfE9DA;padding:5px 12px;border-radius:99px}
.hero h1{font-size:27px;margin:12px 0 4px;line-height:1.1}
.hero p{color:var(--ink-soft);font-weight:600;margin:0;font-size:14px}
.path{position:relative;padding:22px 0 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.node-wrap{position:relative;width:100%;display:flex;justify-content:center}
.node-wrap[data-side="l"]{justify-content:flex-start;padding-left:22%}
.node-wrap[data-side="r"]{justify-content:flex-end;padding-right:22%}
.node{
  width:96px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
  text-align:center;position:relative;
}
.node .disc{
  width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:32px;
  background:var(--white);border:3px solid var(--line);box-shadow:0 7px 0 var(--line);
  transition:transform .12s;
}
.node:active .disc{transform:translateY(3px)}
.node.open .disc{border-color:var(--teal);box-shadow:0 7px 0 var(--teal-dd);background:#EAFBF4}
.node.done .disc{border-color:var(--sun-d);box-shadow:0 7px 0 var(--sun-d);background:#FFF6DD}
.node.locked{cursor:not-allowed}
.node.locked .disc{filter:grayscale(.7);opacity:.55}
.node .nm{font-family:'Fredoka';font-weight:600;font-size:12.5px;line-height:1.15;color:var(--ink)}
.node.locked .nm{color:var(--ink-soft)}
.node .badge-dot{position:absolute;top:-6px;right:6px;font-size:16px}
.connector{width:4px;height:30px;border-radius:9px;background:repeating-linear-gradient(180deg,var(--line) 0 6px,transparent 6px 12px)}
.start-flag{position:absolute;left:50%;transform:translateX(-50%);top:-2px;
  background:var(--coral);color:#fff;font-family:'Fredoka';font-weight:700;font-size:11px;
  padding:4px 12px;border-radius:99px;box-shadow:0 4px 0 var(--coral-d);letter-spacing:.5px;
  animation:bob 1.6s ease-in-out infinite;z-index:2}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}

/* ---------- STAGE INTRO / SECTIONS ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px 4px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;
  font-size:20px;cursor:pointer;flex:none;box-shadow:0 3px 0 var(--line)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.steps{display:flex;gap:6px;flex:1}
.steps i{height:8px;flex:1;border-radius:9px;background:#E9E0CF}
.steps i.on{background:var(--teal)} .steps i.cur{background:var(--coral)}
.sec-label{display:inline-flex;align-items:center;gap:7px;font-family:'Fredoka';font-weight:700;
  font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--coral-d);
  background:#FFEDE6;border:1px solid #FFD3C4;padding:5px 12px;border-radius:99px}
.sec-h{font-size:23px;margin:12px 0 6px;line-height:1.15}
.sec-p{color:var(--ink-soft);font-weight:600;line-height:1.5;font-size:15px}

/* video */
.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;
  background:linear-gradient(135deg,#1f2937,#0b1220);display:grid;place-items:center;color:#fff;
  border:1px solid var(--line);box-shadow:var(--soft);margin-top:14px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .play{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.92);
  display:grid;place-items:center;font-size:24px;color:#111;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.video .vmeta{position:absolute;left:14px;bottom:12px;right:14px;text-align:left}
.video .vmeta b{font-family:'Fredoka';display:block;font-size:15px}
.video .vmeta span{font-size:12px;opacity:.8}
.video .tag{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.45);font-size:11px;
  padding:4px 9px;border-radius:99px;font-weight:700}
.video.as-link{text-decoration:none;background-size:cover;background-position:center;cursor:pointer}
.video.as-link::after{content:"";position:absolute;inset:0;background:rgba(10,15,25,.42)}
.video.as-link .play,.video.as-link .tag,.video.as-link .vmeta{position:relative;z-index:1}
.video.as-link .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.placeholder-note{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:8px;font-weight:600}
.placeholder-note a{color:var(--sky-d);font-weight:800}

/* learn blocks */
.block{margin-top:14px;padding:16px}
.block h3{font-size:16px;margin-bottom:10px;color:var(--ink)}
.ipa-grid{display:flex;flex-wrap:wrap;gap:9px}
.ipa-pill{display:inline-flex;flex-direction:column;align-items:center;gap:2px;
  padding:9px 4px;min-width:62px;border-radius:14px;background:var(--cream);border:1px solid var(--line);
  cursor:pointer;transition:transform .1s}
.ipa-pill:active{transform:scale(.94)}
.ipa-pill b{font-size:19px;color:var(--teal-dd)} .ipa-pill span{font-size:11px;color:var(--ink-soft);font-weight:700}
.ipa-pill.voiced b{color:var(--plum-d)} .ipa-pill.voiceless b{color:var(--sky-d)}
.note{margin-top:12px;background:#FFF6DD;border:1px solid #F4DFA6;border-radius:14px;padding:12px 14px;
  font-size:14px;font-weight:700;color:#7a5a00;display:flex;gap:9px;align-items:flex-start}
.quote{margin-top:16px;text-align:center;font-family:'Fredoka';font-weight:600;font-size:20px;color:var(--teal-dd);
  padding:16px;background:#EAFBF4;border:1px dashed var(--teal);border-radius:18px}
.quote small{display:block;font-family:'Nunito';font-weight:700;font-size:12px;color:var(--ink-soft);margin-top:6px}

/* ---------- EXERCISE ENGINE ---------- */
.q-kind{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft)}
.q-prompt{text-align:center;margin:14px 0 4px}
.q-prompt .big{font-family:'Fredoka';font-weight:700;font-size:34px;line-height:1.1}
.q-prompt .big.ipaword{color:var(--teal-dd)}
.q-sub{text-align:center;color:var(--ink-soft);font-weight:700;font-size:14px;margin-bottom:4px}
.q-blank{display:inline-block;min-width:34px;border-bottom:4px solid var(--coral);margin:0 2px}
.opts{display:flex;flex-direction:column;gap:11px;margin-top:18px}
.opts.wrap{flex-direction:row;flex-wrap:wrap;justify-content:center}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:#fff;border:2px solid var(--line);border-radius:16px;padding:15px 16px;
  box-shadow:0 4px 0 var(--line);transition:transform .08s,border-color .12s,box-shadow .08s;
  font-weight:800;font-size:18px;color:var(--ink);
}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.opt .key{width:30px;height:30px;border-radius:9px;background:var(--cream);border:1px solid var(--line);
  display:grid;place-items:center;font-family:'Fredoka';font-size:14px;color:var(--ink-soft);flex:none}
.opt.sel{border-color:var(--sky);box-shadow:0 4px 0 var(--sky-d);background:#EAF6FE}
.opt.sel .key{background:var(--sky);color:#fff;border-color:var(--sky-d)}
.opt.correct{border-color:var(--good);box-shadow:0 4px 0 var(--good-d);background:#EAFBF1;animation:correctPop .4s cubic-bezier(.2,1.3,.4,1)}
.opt.correct .key{background:var(--good);color:#fff;border-color:var(--good-d)}
@keyframes correctPop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
.opt.wrong{border-color:var(--bad);box-shadow:0 4px 0 var(--bad-d);background:#FFEDF1}
.opt.wrong .key{background:var(--bad);color:#fff;border-color:var(--bad-d)}
.opt.chipopt{width:auto;flex:0 0 auto;font-size:20px;justify-content:center}
.opt.chipopt .key{display:none}
.opt.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.combo{position:absolute;top:54px;left:50%;transform:translateX(-50%);font-family:'Fredoka';font-weight:700;
  color:var(--coral-d);font-size:14px;opacity:0;pointer-events:none}
.combo.show{animation:comboPop 1s ease}
@keyframes comboPop{0%{opacity:0;transform:translateX(-50%) scale(.6)}25%{opacity:1;transform:translateX(-50%) scale(1.1)}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}

/* feedback footer */
#feedback{position:sticky;bottom:0;z-index:20;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
#feedback.show{transform:none}
.fb-inner{padding:16px 18px calc(18px + env(safe-area-inset-bottom));border-top:1px solid;}
#feedback.ok .fb-inner{background:#EAFBF1;border-color:#BfeAcF}
#feedback.no .fb-inner{background:#FFEDF1;border-color:#F8C9D4}
.fb-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fb-head .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:#fff;flex:none}
#feedback.ok .fb-head .ic{background:var(--good)} #feedback.no .fb-head .ic{background:var(--bad)}
.fb-head b{font-family:'Fredoka';font-size:18px}
#feedback.ok .fb-head b{color:var(--good-d)} #feedback.no .fb-head b{color:var(--bad-d)}
.fb-head .xpgain{margin-left:auto;font-family:'Fredoka';font-weight:700;color:var(--sun-d);font-size:15px}
.fb-hint{font-size:14px;font-weight:700;color:#9a3b50;margin-bottom:10px}
#feedback.ok .btn{background:var(--good);box-shadow:var(--shadow) var(--good-d)}
#feedback.no .btn{background:var(--bad);box-shadow:var(--shadow) var(--bad-d)}

/* ---------- REWARD / CELEBRATION ---------- */
.reward{padding:30px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.reward .burst{font-size:74px;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(0) rotate(-25deg)}to{transform:scale(1) rotate(0)}}
.reward h2{font-size:26px;margin-top:8px}
.reward .sub{color:var(--ink-soft);font-weight:700}
.reward .tally{width:100%;margin:18px 0;display:flex;flex-direction:column;gap:10px}
.tally-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:13px 15px;box-shadow:0 3px 0 var(--line);animation:slideIn .5s both}
.tally-row .ic{font-size:22px}.tally-row .lbl{font-weight:800}.tally-row .val{margin-left:auto;font-family:'Fredoka';font-weight:700;font-size:18px;color:var(--teal-dd)}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.badge-card{background:linear-gradient(160deg,#FFF7E3,#FFE9C2);border:1px solid #F2D89A;border-radius:20px;
  padding:20px;width:100%;box-shadow:var(--soft);animation:pop .6s .2s cubic-bezier(.2,1.4,.4,1) both}
.badge-card .em{font-size:54px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.15))}
.badge-card b{display:block;font-family:'Fredoka';font-size:20px;color:#8a5a00;margin-top:6px}
.badge-card span{font-size:13px;color:#9a7330;font-weight:700}
/* unlocked = STATUS label, not a button: soft tint, thin border, no raised
   shadow, default cursor — clearly subordinate to the Continue CTA below it. */
.unlock-toast{width:100%;margin-top:6px;display:flex;align-items:center;gap:10px;
  background:#EAFBF4;color:var(--teal-dd);border:1px solid #BfE9DA;border-radius:14px;
  padding:11px 13px;cursor:default;text-align:left;animation:slideIn .5s .35s both}
.unlock-toast .ut-ic{font-size:17px;flex:none;opacity:.9}
.unlock-toast .ut-body{display:flex;flex-direction:column;line-height:1.25}
.unlock-toast .ut-tag{font-family:'Nunito';font-weight:800;font-size:10px;letter-spacing:1px;
  text-transform:uppercase;color:var(--teal);opacity:.85}
.unlock-toast .ut-text{font-family:'Nunito';font-weight:700;font-size:13.5px;color:var(--ink)}

/* ---------- PROFILE ---------- */
.profile{padding:18px}
.pf-head{display:flex;align-items:center;gap:16px;padding:18px;border-radius:20px;
  background:linear-gradient(140deg,#12B886,#0E9C72);color:#fff;box-shadow:var(--soft)}
.pf-head .av{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:34px;flex:none}
.pf-head h2{font-size:22px}.pf-head p{font-weight:700;opacity:.9;font-size:13px;margin:2px 0 0}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;box-shadow:0 3px 0 var(--line)}
.stat .v{font-family:'Fredoka';font-weight:700;font-size:22px;color:var(--teal-dd)}
.stat .l{font-size:11px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.sect-title{font-family:'Fredoka';font-weight:700;font-size:15px;margin:20px 4px 10px;color:var(--ink)}
.badge-shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bcell{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;box-shadow:0 3px 0 var(--line)}
.bcell .em{font-size:30px}.bcell .n{font-size:11px;font-weight:800;margin-top:4px;line-height:1.1}
.bcell.locked{filter:grayscale(1);opacity:.4}

/* bottom nav */
#nav{position:sticky;bottom:0;z-index:25;display:flex;background:rgba(255,252,246,.94);
  backdrop-filter:blur(8px);border-top:1px solid var(--line)}
#nav button{flex:1;background:none;border:none;padding:11px 0 calc(11px + env(safe-area-inset-bottom));
  font-family:'Fredoka';font-weight:600;font-size:11px;color:var(--ink-soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
#nav button .i{font-size:21px}
#nav button.on{color:var(--teal-dd)}

/* confetti + xp float */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti{position:absolute;width:10px;height:14px;border-radius:2px;will-change:transform,opacity}
.xpfloat{position:fixed;font-family:'Fredoka';font-weight:700;color:var(--sun-d);font-size:20px;
  z-index:61;pointer-events:none;animation:xpf 1s ease-out forwards;text-shadow:0 1px 2px #fff}
@keyframes xpf{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1;transform:translateY(-12px) scale(1.05)}100%{opacity:0;transform:translateY(-64px) scale(1.05)}}
.lvlup{position:fixed;left:50%;top:42%;transform:translateX(-50%);z-index:62;background:var(--plum);color:#fff;

// build a near-miss IPA distractor by nudging one symbol (kept simple & safe)
function nearMiss(ipa){
  const swaps=[["iː","ɪ"],["ɪ","iː"],["uː","ʊ"],["ʊ","uː"],["æ","ʌ"],["ʌ","æ"],["ɔː","ɒ"],["ɒ","ɔː"],

  for(const [from,to] of swaps){ if(ipa.includes(from)) return ipa.replace(from,to); }
  return ipa.replace(/.$/, ""); // fallback: drop last symbol
}

function genListen(pairs){                       // listening: hear word → choose it

      hint:`Focus on ${p.f}. ${cap(p.a)} = ${p.ia} · ${cap(p.b)} = ${p.ib}. Tap 🔊 to compare.`});
  });

/* =====================================================================
   2. PERSISTENCE LAYER  —  browser localStorage with in-memory fallback.
      Fully standalone: works in any browser and when opened as a local
      file:// download. No Claude / artifact storage dependency.
   ===================================================================== */
const KEY = "touch_ipa_state_v1";
let memCache = null;
function lsAvailable(){
  try{ const t="__touch_test__"; localStorage.setItem(t,"1"); localStorage.removeItem(t); return true; }
  catch(e){ return false; }   // private mode / disabled storage → in-memory only
}
const HAS_LS = lsAvailable();
const Persist = {
  load(){
    if(memCache) return memCache;
    if(HAS_LS){
      try{ const raw = localStorage.getItem(KEY); if(raw){ memCache = JSON.parse(raw); return memCache; } }
      catch(e){ /* corrupt or blocked → fall through */ }
    }
    return null;
  },
  save(obj){
    memCache = obj;
    if(HAS_LS){
      try{ localStorage.setItem(KEY, JSON.stringify(obj)); }
      catch(e){ /* quota / blocked → kept in memCache for this session */ }
    }
  }
};

/* =====================================================================
   3. STATE STORE  —  single source of truth for the learner.
   ===================================================================== */
function freshState(){
  return {
    xp:0, combo:0, bestCombo:0,
    streak:1, lastActive:new Date().toDateString(),
    badges:{},                 // id -> true
    unlocked:["s0"],           // 6. progression
    stages:{},                 // id -> {completed, best, correct, total}
    courseDone:false,
    // --- next-phase additions ---
    dailyGoal:50,              // PRIORITY 3: daily XP goal (20/50/100)
    today:new Date().toDateString(),
    todayXP:0,
    goalHitToday:false,
    weak:{},                   // PRIORITY 6: ipaToken -> miss count (lightweight)
    review:[]                  // PRIORITY 3: recycled wrong questions (capped, lightweight)
  };
}
let S = freshState();

function dayDiff(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function touchStreak(){
  const today = new Date().toDateString();
  if(S.lastActive!==today){
    const d = dayDiff(S.lastActive, today);
    S.streak = d===1 ? S.streak+1 : 1;
    S.lastActive = today;
  }
}
function touchDaily(){            // reset the daily counter when a new day starts
  const today = new Date().toDateString();
  if(S.today!==today){ S.today=today; S.todayXP=0; S.goalHitToday=false; }
}
function save(){ Persist.save(S); }

/* =====================================================================
   4. XP & LEVEL SYSTEM
   ===================================================================== */
function levelThreshold(n){ return 75*n*(n+1); } // cumulative XP needed to REACH level n (n>=1 => 150,450,900...)
function levelInfo(xp){
  let lvl=1; while(xp >= levelThreshold(lvl+1)) lvl++;
  const cur = levelThreshold(lvl), next = levelThreshold(lvl+1);
  return {lvl, into:xp-cur, span:next-cur, pct:Math.min(1,(xp-cur)/(next-cur))};
}
function awardXP(amount, atEl){
  const before = levelInfo(S.xp).lvl;
  S.xp += amount;
  touchDaily();
  S.todayXP += amount;                         // PRIORITY 3: daily goal progress
  const after = levelInfo(S.xp).lvl;

let SOUND = true, AC=null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freq, t0, dur, type="sine", vol=.13){
  const c=ac(); if(!c) return; const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(c.destination);
  const now=c.currentTime+t0; g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(vol,now+.02);
  g.gain.exponentialRampToValueAtTime(.0001,now+dur); o.start(now); o.stop(now+dur+.02);
}
function sfx(kind){
  if(!SOUND) return;
  if(kind==="ok"){ tone(660,0,.12,"triangle"); tone(990,.09,.16,"triangle"); }
  else if(kind==="no"){ tone(200,0,.18,"sawtooth",.09); }
  else if(kind==="reward"){ [523,659,784,1046].forEach((f,i)=>tone(f,i*.1,.25,"triangle",.12)); }
  else if(kind==="tap"){ tone(440,0,.05,"sine",.05); }
}

/* =====================================================================
   PRONUNCIATION AUDIO ENGINE  (MVP)
   ---------------------------------------------------------------------
   NOTE: This is NOT real human-recorded pronunciation. It uses the
   browser's built-in SpeechSynthesis to READ WORDS CLEARLY so beginners
   can train their ears. Each playable item carries an optional `src`
   (an MP3 URL). When a teacher later drops in real recordings:
        playAudio("sheep", "audio/sheep.mp3")
   the MP3 plays; otherwise we fall back to SpeechSynthesis automatically.
   Raw IPA symbols are never spoken — we always speak the EXAMPLE WORD.
   ===================================================================== */
const Audio$ = {
  ready:false, voice:null, current:null,
  init(){
    if(!("speechSynthesis" in window)) return;
    const load = ()=>{
      const vs = speechSynthesis.getVoices();
      if(!vs.length) return;
      // prefer a natural en-GB / en-US voice
      this.voice =
        vs.find(v=>/en-GB/i.test(v.lang) && /google|natural|female/i.test(v.name)) ||
        vs.find(v=>/en-GB/i.test(v.lang)) ||
        vs.find(v=>/en-US/i.test(v.lang)) ||
        vs.find(v=>/^en/i.test(v.lang)) || vs[0];
      this.ready = true;
    };
    load(); speechSynthesis.onvoiceschanged = load;
  },
  // word: text to speak | src: optional MP3 URL (future teacher audio)
  play(word, src){
    if(src){                                   // real audio file takes priority
      try{
        const a = new Audio(src);
        a.play().catch(()=>this.speak(word));   // network/format issue → fallback
        return;
      }catch(e){ /* fall through to TTS */ }
    }
    this.speak(word);
  },
  speak(word){
    if(!word || !("speechSynthesis" in window)) return;
    try{
      speechSynthesis.cancel();                 // stop overlaps, allow rapid replay
      const u = new SpeechSynthesisUtterance(String(word));
      if(this.voice) u.voice = this.voice;
      u.lang = (this.voice && this.voice.lang) || "en-GB";
      u.rate = 0.78;                            // slower, beginner-friendly
      u.pitch = 1.0; u.volume = 1.0;
      this.current = u; speechSynthesis.speak(u);
    }catch(e){}
  }
};
// trigger a playback + pulse the clicked element
function playWord(word, src, el){
  sfx("tap");
  Audio$.play(word, src);
  if(el){ el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); }
}
// small reusable speaker control (a SPAN so it can live inside .opt buttons)
function speaker(word, src, extra){
  if(!word) return "";
  const s = src ? ` data-src="${src}"` : "";
  return `<span class="spk ${extra||''}" role="button" data-action="speak" data-word="${word}"${s} aria-label="Play ${word}">🔊</span>`;
}

const CONF_COLORS=["#12B886","#FF7A59","#FFC247","#4FB0E8","#8B6CE0","#FF5C7A"];
function confetti(n=90){
  const fx=document.getElementById("fx");
  for(let i=0;i<n;i++){
    const c=document.createElement("div"); c.className="confetti";
    const x=Math.random()*100, rot=Math.random()*360, dur=1.6+Math.random()*1.4, delay=Math.random()*.3;

// how many questions to serve per stage session (keeps a session focused &
// replayable even though the bank holds 80–120). Welcome stays tiny.
const STAGE_QUESTION_CAP = 18;
function buildQueue(s){
  const all = s.exercises.slice();
  if(s.id==="s0") return all;                 // welcome = its single check
  const shuffled = shuffle(all);              // PRIORITY 1: randomize order
  const cap = Math.min(STAGE_QUESTION_CAP, shuffled.length);
  // sprinkle any pending review items in first (PRIORITY 3 hook)
  return shuffled.slice(0, cap);
}
function startStage(id){
  const s = COURSE.find(x=>x.id===id);
  const queue = buildQueue(s);
  session = { stageId:id, step:"video", qi:0, correct:0, total:queue.length, earned:0,
              perfect:true, comboStart:S.combo, queue };
  go({name:"stage"});
}
// accessor: the active question list (session queue, or full bank as fallback)
function sessionExercises(s){ return (session && session.queue) ? session.queue : s.exercises; }

/* =====================================================================
   PRIORITY 3 — TODAY'S REVIEW  (lightweight, no dashboard)
   Recycles previously-wrong questions + a few items targeting weak sounds.
   Reuses the exact stage-quiz engine via a small synthetic stage object.
   ===================================================================== */
const REVIEW_STAGE = { id:"review", title:"Today's Review", short:"Review", icon:"🔁", color:"coral",
  exercises:[], reward:{ xp:0, title:"Review complete!", line:"" } };
function findStage(id){ return id==="review" ? REVIEW_STAGE : COURSE.find(x=>x.id===id); }
// gather a few extra questions that drill the learner's weakest sounds
function weakSoundQuestions(){
  const weakTokens = Object.entries(S.weak).filter(([k,v])=>v>=2).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  if(!weakTokens.length) return [];
  // pull matching minimal-pair IPA questions from the bank
  const out=[];
  for(const p of PAIRS){
    if(weakTokens.some(t=>p.ia.includes(t.replace(/\//g,"")) || p.ib.includes(t.replace(/\//g,"")) || p.f.includes(t.replace(/\//g,"")))){
      out.push(ex({kind:"Choose the IPA", prompt:p.a, options:[opt(p.ia,true),opt(p.ib)],
        hint:`${p.f}. ${cap(p.a)} = ${p.ia}, ${cap(p.b)} = ${p.ib}.`}));
    }
    if(out.length>=6) break;
  }
  return out;
}
function reviewPoolCount(){
  return Math.min(15, S.review.length + weakSoundQuestions().length);
}
function startReview(){
  const pool = shuffle([...S.review, ...weakSoundQuestions()]);
  const queue = pool.slice(0, 15);
  if(!queue.length){ return; }
  REVIEW_STAGE.exercises = queue;
  session = { stageId:"review", step:"quiz", qi:0, correct:0, total:queue.length, earned:0,
              perfect:true, comboStart:S.combo, queue, isReview:true };
  S.combo=0; renderHUD(); go({name:"stage"});
}

// extract the 11-char video id from any YouTube URL shape
function ytId(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  return m ? m[1] : null;
}
// proper, Safari-safe embed URL: no autoplay, privacy domain, inline playback
function ytEmbedUrl(id){
  return "https://www.youtube-nocookie.com/embed/" + id +
         "?rel=0&modestbranding=1&playsinline=1&autoplay=0";
}
// embeds commonly fail with "Error 153" on file:// or srcdoc previews → use link fallback there
function embedUnsupported(){
  const p = location.protocol;
  return p === "file:" || p === "about:" || p === "data:";
}
// requirement 4: if a YouTube iframe cannot load (blocked, no network, embedding
// disabled, Error 153), swap its wrapper for a tappable thumbnail that opens YouTube.
function ytFallback(frameId, id, title){
  const wrap = document.getElementById(frameId+"_wrap");
  if(!wrap || wrap.dataset.fellback) return;
  wrap.dataset.fellback = "1";
  const watch = "https://www.youtube.com/watch?v=" + id;
  const thumb = "https://img.youtube.com/vi/" + id + "/hqdefault.jpg";
  wrap.outerHTML =
    `<a class="video as-link" href="${watch}" target="_blank" rel="noopener" style="background-image:url('${thumb}')">
       <span class="tag">▶ WATCH ON YOUTUBE</span>

     </a>`;
}
function renderVideo(s){

  if(!id){

      player = `<div class="video" id="${fid}_wrap">

/* =====================================================================
   9. EXERCISE ENGINE  —  ONE renderer for every question variant.
      STEP 3 of the stage template.
   ===================================================================== */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function renderExercise(s){
  const q = sessionExercises(s)[session.qi];
  if(!session._opts || session._optsFor!==session.qi){
    session._opts = shuffle(q.options); session._optsFor=session.qi; session.sel=null; session.locked=false;
  }
  const opts = session._opts;
  const isChip = q.variant==="fill";
  // prompt rendering by variant (with audio where a WORD is shown)
  let promptHTML="";
  if(q.variant==="fill"){
    const shown = q.prompt.replace(/_+/, `<span class="q-blank">&nbsp;?&nbsp;</span>`);
    promptHTML = `<div class="q-sub">Complete the transcription of <b>“${q.word}”</b> ${speaker(q.word,q.audioSrc)}</div>
                  <div class="q-prompt"><span class="big ipaword ipa">${shown}</span></div>`;
  } else if(q.variant==="word"){
    promptHTML = `<div class="q-sub">Which word is this?</div>
                  <div class="q-prompt"><span class="big ipaword ipa">${q.prompt}</span></div>`;
  } else if(q.variant==="identify"){
    const spk = isWordLabel(q.prompt) ? " "+speaker(q.prompt,q.audioSrc,"big") : "";
    promptHTML = `<div class="q-prompt"><span class="big ipaword ipa">${q.prompt}</span>${spk}</div>
                  <div class="q-sub">${q.sub||"Which one?"}</div>`;
  } else if(q.variant==="listen"){
    // listening practice INSIDE the lesson: hear the word, then pick it
    promptHTML = `<div class="q-sub">${q.sub||"Listen, then choose the word you hear"}</div>
                  <div class="big-listen"><button class="listen-btn" data-action="listen" data-word="${q.word}"${q.audioSrc?` data-src="${q.audioSrc}"`:""}>🔊 Tap to listen</button></div>`;
  } else { // choose IPA for a word
    promptHTML = `<div class="q-sub">${q.sub||"Choose the correct IPA for"}</div>
                  <div class="q-prompt"><span class="big">${q.prompt}</span> ${speaker(q.prompt,q.audioSrc,"big")}</div>`;
  }
  const optsHTML = opts.map((o,idx)=>{
    const spk = isWordLabel(o.label) ? speaker(o.label, o.src) : "";
    return `
    <button class="opt ${isChip?'chipopt':''}" data-action="pick" data-idx="${idx}">
      ${isChip?"":`<span class="key">${String.fromCharCode(65+idx)}</span>`}
      <span class="ipa">${o.label}</span>${spk?`<span class="opt-spk">${spk}</span>`:""}
    </button>`;}).join("");

  $screen().innerHTML = `
    ${topbar(2)}
    <div class="pad" style="position:relative">
      <div class="combo" id="comboMsg"></div>
      <span class="q-kind">${q.kind} · ${session.qi+1}/${session.total}</span>
      ${promptHTML}
      <div class="opts ${isChip?'wrap':''}" id="opts">${optsHTML}</div>
    </div>`;
  if(q.variant==="listen") setTimeout(()=>Audio$.play(q.word, q.audioSrc), 350);  // play once on load
}

function pickOption(idx){
  if(session.locked) return;
  session.sel = idx; sfx("tap");
  [...document.querySelectorAll("#opts .opt")].forEach((el,i)=>el.classList.toggle("sel", i===idx));
  showCheck();
}
function showCheck(){
  const fb=document.getElementById("feedback");
  fb.className="show"; fb.innerHTML=`<div class="fb-inner" style="background:#fff;border-color:var(--line)">
    <button class="btn" data-action="check">Check answer</button></div>`;
}

function checkAnswer(){
  const s = findStage(session.stageId);
  const q = sessionExercises(s)[session.qi];
  const opts = session._opts, sel = session.sel;
  if(sel==null) return;
  session.locked=true;
  const correct = opts[sel].correct;
  const els=[...document.querySelectorAll("#opts .opt")];
  els.forEach((el,i)=>{
    el.classList.remove("sel");
    if(opts[i].correct) el.classList.add("correct");
    else if(i===sel) el.classList.add("wrong");
    el.style.pointerEvents="none";
  });

  if(correct){
    sfx("ok");
    S.combo++; if(S.combo>S.bestCombo) S.bestCombo=S.combo;
    session.correct++;
    let gain = 10 + (S.combo>=5?5:0);          // 4. XP per correct + combo bonus
    session.earned += gain;
    // PRIORITY 6: ease off a weak sound when answered right
    const cl = opts.find(o=>o.correct).label;
    if(!isWordLabel(cl) && S.weak[cl]) S.weak[cl] = Math.max(0, S.weak[cl]-1);
    const okMsg = q.okMsg || pick(PRAISE);
    if(S.combo===5 && !S.badges.hot_streak){ S.badges.hot_streak=true; setTimeout(()=>miniBadge("hot_streak"),300); }
    if(COMBO_LINES[S.combo]) comboFlash(COMBO_LINES[S.combo]);
    feedbackOK(okMsg, gain);
    const correctEl = els.find(e=>e.classList.contains("correct"));
    awardXP(gain, correctEl);
  } else {
    sfx("no");
    session.perfect=false; S.combo=0;          // reset combo only — no penalty, learning continues
    // lightweight weak-sound tracking (unrelated to lives)
    const cl = opts.find(o=>o.correct).label;
    if(!isWordLabel(cl)) S.weak[cl] = (S.weak[cl]||0)+1;
    // PRIORITY 3: stash this question for "Today's Review" (dedupe by prompt, cap 30)
    addToReview(q);
    els[sel].classList.add("shake");
    feedbackNO(q.hint);
    renderHUD();
  }
  save();
}
function reviewKey(q){ return (q.variant||"std")+"|"+(q.prompt||q.word||""); }
function addToReview(q){
  const key = reviewKey(q);
  S.review = S.review.filter(r=>reviewKey(r)!==key);   // move-to-front dedupe
  // store a clean copy (the engine re-shuffles options at render time)
  S.review.unshift(JSON.parse(JSON.stringify(q)));
  if(S.review.length>30) S.review.length = 30;
}
function comboFlash(txt){ const c=document.getElementById("comboMsg"); if(!c)return; c.textContent=txt; c.classList.remove("show"); void c.offsetWidth; c.classList.add("show"); }

function feedbackOK(msg, gain){
  const fb=document.getElementById("feedback");
  fb.className="ok show";
  fb.innerHTML=`<div class="fb-inner">
    <div class="fb-head"><span class="ic">✓</span><b>${msg}</b><span class="xpgain">+${gain} XP</span></div>
    <button class="btn" data-action="next">Continue</button></div>`;
}
function feedbackNO(hint){
  const fb=document.getElementById("feedback");
  fb.className="no show";
  fb.innerHTML=`<div class="fb-inner">
    <div class="fb-head"><span class="ic">↻</span><b>Not quite — here's why</b></div>
    <div class="fb-hint">💡 ${hint||"Listen again to the vowel length and mouth shape."}</div>
    <button class="btn" data-action="next">Got it, continue</button></div>`;
}
function nextQuestion(){
  document.getElementById("feedback").className="";
  const s = findStage(session.stageId);
  session.qi++;
  if(session.qi>=sessionExercises(s).length){ finishStage(s); }
  else render();
}

/* =====================================================================
   8. REWARD SYSTEM  —  STEP 4 of the stage template.
   ===================================================================== */
function finishStage(s){
  if(session.isReview){                                 // PRIORITY 3: review wrap-up
    // clear the items the learner just reviewed from the pending pool
    const reviewedKeys = new Set(session.queue.map(reviewKey));
    S.review = S.review.filter(r=>!reviewedKeys.has(reviewKey(r)));
    save();
    session.step="reward";
    sfx("reward"); confetti(90);
    render();
    return;
  }
  // record progress
  const prev = S.stages[s.id]||{};
  const wasDone = prev.completed;
  S.stages[s.id] = {
    completed:true,
    correct:session.correct, total:session.total,
    best: Math.max(prev.best||0, session.correct)
  };
  if(!wasDone){
    awardXP(s.reward.xp);                              // big stage bonus
    if(s.reward.badge && !S.badges[s.reward.badge]) S.badges[s.reward.badge]=true;
    if(session.perfect && session.total>0 && !S.badges.flawless) S.badges.flawless=true;
    unlock(nextStageId(s.id));                          // progression
    if(s.reward.final) S.courseDone=true;
  }
  save();
  session.step="reward";
  sfx("reward"); confetti(120);
  render();
}
function renderReward(s){
  if(session.isReview){                                 // lightweight review summary
    const acc = session.total? Math.round(session.correct/session.total*100) : 100;
    $screen().innerHTML = `
      <div class="reward">
        <div class="burst">🔁</div>
        <h2>${pick(["Great refresher!","Nicely reviewed!","Your ear is sharpening!","Strong review!"])}</h2>
        <div class="sub">${session.correct}/${session.total} this round · ${acc}% accuracy</div>
        <div class="tally">
          <div class="tally-row"><span class="ic">⚡</span><span class="lbl">XP earned</span><span class="val">+${session.earned}</span></div>
          <div class="tally-row" style="animation-delay:.1s"><span class="ic">🎯</span><span class="lbl">Today's goal</span><span class="val">${Math.min(100,Math.round(S.todayXP/Math.max(1,S.dailyGoal)*100))}%</span></div>
        </div>
        <div style="height:16px"></div>
        ${reviewPoolCount()>0?`<button class="btn coral" data-action="startReview">Review more 🔁</button><div style="height:10px"></div>`:""}
        <button class="btn ghost" data-action="goMap">Back to map</button>
      </div>`;
    return;
  }
  const r=s.reward, b=BADGES[r.badge];
  const acc = session.total? Math.round(session.correct/session.total*100) : 100;
  const earnedFlawless = session.perfect && session.total>0;
  $screen().innerHTML = `
    <div class="reward">
      <div class="burst">${r.final?"🎉":"🌟"}</div>
      <h2>${r.title}</h2>
      <div class="sub">Stage complete${session.total?` · ${session.correct}/${session.total} first-try`:""}</div>

      ${r.badge?`<div class="badge-card"><div class="em">${b.em}</div><b>${b.name} Badge</b><span>${b.desc}</span></div>`:""}

      <div class="tally">
        <div class="tally-row" style="animation-delay:.05s"><span class="ic">⚡</span><span class="lbl">XP this stage</span><span class="val">+${session.earned + (S.stages[s.id]?r.xp:0)}</span></div>
        ${session.total?`<div class="tally-row" style="animation-delay:.15s"><span class="ic">🎯</span><span class="lbl">Accuracy</span><span class="val">${acc}%</span></div>`:""}
        <div class="tally-row" style="animation-delay:.25s"><span class="ic">🔥</span><span class="lbl">Best combo</span><span class="val">${S.bestCombo}</span></div>
        ${earnedFlawless?`<div class="tally-row" style="animation-delay:.35s"><span class="ic">💎</span><span class="lbl">Flawless bonus</span><span class="val">unlocked!</span></div>`:""}
      </div>

      ${r.line?`<div class="unlock-toast"><span class="ut-ic">🔓</span><span class="ut-body"><span class="ut-tag">Unlocked</span><span class="ut-text">${r.line.replace(/^.*?Unlocked\s*[—-]\s*/i,"").trim()||r.line}</span></span></div>`:""}
      <div style="height:20px"></div>
      ${r.final
        ? `<button class="btn sun" data-action="goDone">See your trophy 🏆</button>`
        : `<button class="btn" data-action="goMap">Continue your journey →</button>`}
    </div>`;
}

/* ---------- COURSE COMPLETION ---------- */
function renderCourseComplete(){
  confetti(140); sfx("reward");
  const earned = Object.keys(S.badges).length, totalB=Object.keys(BADGES).length;
  $screen().innerHTML = `
    <div class="reward">
      <div class="burst">👑</div>
      <h2>TOUCH Pronunciation Master!</h2>
      <div class="sub">You completed the entire course 🎓</div>
      <div class="badge-card" style="margin-top:14px"><div class="em">${BADGES.master.em}</div>
        <b>${BADGES.master.name}</b><span>The highest TOUCH honour</span></div>
      <div class="tally">
        <div class="tally-row"><span class="ic">⚡</span><span class="lbl">Total XP</span><span class="val">${S.xp}</span></div>
        <div class="tally-row" style="animation-delay:.1s"><span class="ic">🏅</span><span class="lbl">Badges earned</span><span class="val">${earned}/${totalB}</span></div>
        <div class="tally-row" style="animation-delay:.2s"><span class="ic">📈</span><span class="lbl">Level</span><span class="val">${levelInfo(S.xp).lvl}</span></div>
      </div>
      <div class="quote" style="margin-top:4px">Consistency is more important than perfection.<small>Keep speaking — keep growing. 💚</small></div>
      <div style="height:18px"></div>
      <button class="btn ghost" data-action="goMap">Back to course map</button>
    </div>`;
}

/* ---------- PROFILE ---------- */
function renderProfile(){
  const li=levelInfo(S.xp);
  const stagesDone = COURSE.filter(s=>S.stages[s.id]?.completed).length;
  const shelf = Object.keys(BADGES).map(id=>{
    const b=BADGES[id], have=!!S.badges[id];
    return `<div class="bcell ${have?'':'locked'}"><div class="em">${b.em}</div><div class="n">${b.name}</div></div>`;
  }).join("");
  $screen().innerHTML = `
    <div class="profile">
      <div class="pf-head">
        <div class="av">🧑‍🚀</div>
        <div><h2>TOUCH Learner</h2><p>Level ${li.lvl} · 🔥 ${S.streak}-day streak</p></div>
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="v">${S.xp}</div><div class="l">Total XP</div></div>
        <div class="stat"><div class="v">${stagesDone}/${COURSE.length}</div><div class="l">Stages</div></div>
        <div class="stat"><div class="v">${S.bestCombo}</div><div class="l">Best Combo</div></div>
      </div>

      <div class="sect-title">🎯 Daily Goal</div>
      <div class="goal-pick">
        ${[20,50,100].map(g=>`<button class="gp ${S.dailyGoal===g?'on':''}" data-action="setGoal" data-g="${g}">${g} XP</button>`).join("")}
      </div>
      <div class="fineprint" style="text-align:left;padding:8px 4px">Today: ${S.todayXP} / ${S.dailyGoal} XP ${S.todayXP>=S.dailyGoal?"✓ reached!":""}</div>

      <div class="sect-title">🏅 Badge Collection (${Object.keys(S.badges).length}/${Object.keys(BADGES).length})</div>
      <div class="badge-shelf">${shelf}</div>

      <div class="sect-title">⚙️ Settings</div>
      <button class="btn ghost" data-action="resetCourse">Reset all progress</button>
      <div class="fineprint">Progress saves automatically to this device.</div>
    </div>`;
}

/* ---------- mini badge toast (mid-quiz) ---------- */
function miniBadge(id){
  const b=BADGES[id]; const d=document.createElement("div"); d.className="lvlup";
  d.style.background="var(--sun)"; d.style.color="#5a3d00";
  d.innerHTML=`${b.em} Badge: ${b.name}!`;
  document.getElementById("fx").appendChild(d); setTimeout(()=>d.remove(),1700); confetti(40);
}

/* =====================================================================
   MINIMAL PAIRS  —  reference data for the in-lesson listening exercises
   (the standalone Listening Lab was removed to keep the journey linear).
   Each pair carries optional MP3 sources for future teacher recordings.
   ===================================================================== */
const MINIMAL_PAIRS = [
  {a:"ship", b:"sheep", ipaA:"/ʃɪp/",  ipaB:"/ʃiːp/", focus:"/ɪ/ vs /iː/"},
  {a:"bit",  b:"beat",  ipaA:"/bɪt/",  ipaB:"/biːt/", focus:"/ɪ/ vs /iː/"},
  {a:"full", b:"fool",  ipaA:"/fʊl/",  ipaB:"/fuːl/", focus:"/ʊ/ vs /uː/"},
  {a:"cat",  b:"cut",   ipaA:"/kæt/",  ipaB:"/kʌt/",  focus:"/æ/ vs /ʌ/"},
  {a:"fan",  b:"van",   ipaA:"/fæn/",  ipaB:"/væn/",  focus:"/f/ vs /v/"},
  {a:"sink", b:"think", ipaA:"/sɪŋk/", ipaB:"/θɪŋk/", focus:"/s/ vs /θ/"}
  // future: {a:"...", b:"...", srcA:"audio/x.mp3", srcB:"audio/y.mp3"}
];

/* =====================================================================
   EVENT DELEGATION  —  every interaction routes through here.
   ===================================================================== */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-action]"); if(!t) return;
  const a = t.dataset.action;
  switch(a){
    case "goMap": session=null; go({name:"map"}); break;
    case "goProfile": go({name:"profile"}); break;
    case "goDone": go({name:"done"}); break;
    case "openStage": if(isUnlocked(t.dataset.id)) startStage(t.dataset.id); break;
    case "startReview": startReview(); break;
    case "toLearn": session.step="learn"; render(); window.scrollTo(0,0); break;
    case "toQuiz": session.step="quiz"; session.qi=0; S.combo=0; renderHUD(); render(); window.scrollTo(0,0); break;
    case "pick": pickOption(+t.dataset.idx); break;
    case "check": checkAnswer(); break;
    case "next": nextQuestion(); window.scrollTo(0,0); break;
    // audio (in-lesson playback)
    case "playword": playWord(t.dataset.word, t.dataset.src, t); break;
    case "speak": playWord(t.dataset.word, t.dataset.src, t); break;
    case "listen": playWord(t.dataset.word, t.dataset.src, t); break;
    // daily goal
    case "cycleGoal": { const order=[20,50,100]; S.dailyGoal = order[(order.indexOf(S.dailyGoal)+1)%order.length]; save(); renderHUD(); renderMap(); } break;
    case "setGoal": S.dailyGoal=+t.dataset.g; save(); renderHUD(); renderProfile(); break;
    case "toggleSound": SOUND=!SOUND; if(SOUND){ac(); sfx("tap");} renderHUD(); break;
    case "resetCourse":
      if(confirm("Reset ALL progress, XP and badges? This can't be undone.")){
        S=freshState(); save(); go({name:"map"});
      } break;
  }
});

/* =====================================================================
   BOOT
   ===================================================================== */
(function init(){
  Audio$.init();                               // warm up speech voices
  const loaded = Persist.load();
  if(loaded){ S = Object.assign(freshState(), loaded); }
  touchStreak(); touchDaily(); save();
  go({name:"map"});
})();
</script>
